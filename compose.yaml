name: custom-bot
x-app-env: &app-env
  APP_MODE: ${APP_MODE:-local}
  APP_URL: ${APP_URL:-http://localhost:3100}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
  DATABASE_URL: postgres://custom_bot:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/custom_bot
  SMTP_HOST: ${SMTP_HOST:-mail}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-support@example.test}
  ACTION_CREDENTIAL_KEY: ${ACTION_CREDENTIAL_KEY:-}
services:
  db:
    image: pgvector/pgvector:0.8.2-pg17-bookworm@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    environment:
      POSTGRES_USER: custom_bot
      POSTGRES_DB: custom_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [database:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U custom_bot -d custom_bot]
      interval: 2s
      timeout: 5s
      retries: 30
  mail:
    profiles: [local]
    image: axllent/mailpit:v1.29.3@sha256:fdaf09bd71dc0829ce8b62e4bfb5180bc5c0674c3e444283fc90681853f5a3c0
    ports: [127.0.0.1:8025:8025]
    networks: [internal, web]
  migrate:
    build: .
    command: [node, dist/migrate.js]
    environment: *app-env
    depends_on:
      db: {condition: service_healthy}
    networks: [internal]
  app:
    build: .
    environment: *app-env
    ports: [127.0.0.1:3100:3000]
    depends_on:
      migrate: {condition: service_completed_successfully}
      worker: {condition: service_started}
    networks: [internal, web]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 20
  # Optional knowledge: `docker compose run --rm models` downloads the pinned embedding model once (about 135 MB) into the
  # model volume and verifies it; then restart the worker. Without it, chat works and knowledge is reported unavailable.
  models:
    profiles: [knowledge]
    build: worker
    command: [python, knowledge.py]
    volumes: [models:/models]
    networks: [web]
  worker:
    build: worker
    environment:
      APP_MODE: ${APP_MODE:-local}
      DATABASE_URL: postgres://custom_bot:${POSTGRES_PASSWORD}@db:5432/custom_bot
      ACTION_CREDENTIAL_KEY: ${ACTION_CREDENTIAL_KEY:-}
      # Provider keys reach only the worker, never the app. Without them, connected agents are reported unavailable and decision
      # steps take their failure route.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      PROVIDER_RATES: ${PROVIDER_RATES:-}
      # Portfolio demo only (local mode): DEMO_PUBLIC_HOSTS=northwind.demo.test lets exactly that host resolve to the private
      # network, trusted only through the local-only demo CA. Hosted mode refuses both.
      DEMO_PUBLIC_HOSTS: ${DEMO_PUBLIC_HOSTS:-}
      DEMO_CA_FILE: ${DEMO_PUBLIC_HOSTS:+/demo/cert.pem}
    depends_on:
      migrate: {condition: service_completed_successfully}
      models: {condition: service_completed_successfully, required: false}
    # The internal network has no outbound access: embedding runs only from the verified cache, if installed.
    # Connected generation needs outbound HTTPS: add compose.connected.yaml (see README, Providers).
    volumes: [models:/models:ro, ./demo/cert.pem:/demo/cert.pem:ro]
    networks: [internal]
    healthcheck:
      test: [CMD, python, -c, "import os,psycopg; c=psycopg.connect(os.environ['DATABASE_URL']); assert c.execute(\"SELECT 1 FROM worker_health WHERE id='worker' AND heartbeat>now()-interval '10 seconds'\").fetchone()"]
      interval: 5s
      timeout: 5s
      retries: 20
  # Portfolio demo (README, Portfolio demo): Northwind Kettles, a fictional business with synthetic data. Its HTTPS order API and
  # help site answer only on the private network as northwind.demo.test; its shop page is on 127.0.0.1:3300.
  demo:
    profiles: [demo]
    build: .
    command: [node, /demo/server.mjs]
    environment:
      APP_URL: ${APP_URL:-http://localhost:3100}
    volumes: [./demo:/demo:ro]
    # Port 443 as the image's unprivileged user.
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}
    ports: [127.0.0.1:3300:3300]
    networks:
      internal: {aliases: [northwind.demo.test]}
      web: {}
  # Seeds the demo Business through the app's own APIs, signed in as SEED_OWNER_EMAIL; add --connected for real providers.
  seed:
    profiles: [seed]
    build: .
    command: [node, dist/seed.js]
    environment:
      <<: *app-env
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
      SEED_SUPPORT_PASSWORD: ${SEED_SUPPORT_PASSWORD:-}
    volumes: [./demo:/demo:ro]
    depends_on:
      app: {condition: service_healthy}
    networks: [internal]
networks:
  internal: {internal: true}
  web: {}
volumes:
  database: {}
  models: {}
