# Test-only short expiry and controlled external fixtures; no test routes or alternate authorization.
services:
  app:
    environment:
      APP_MODE: test
      TEST_OTP_TTL: '8'
      TEST_INVITATION_TTL: '20'
      # Test-only synthetic key; it protects nothing. Real deployments set their own outside the database.
      ACTION_CREDENTIAL_KEY: 7e57000000000000000000000000000000000000000000000000000000007e57
  # Tests exercise real local embeddings, so the test stack always installs and verifies the model.
  models:
    profiles: !reset []
  worker:
    environment:
      APP_MODE: test
      TEST_JOB_LEASE_SECONDS: '5'
      # The fixture answers as api.deepseek.com, dashscope-intl.aliyuncs.com and api.typesafe.ai on the internal network, so
      # generation and decisions take the production endpoints, keys and checks. These keys are synthetic test-only values; they
      # protect nothing.
      TEST_CA_FILE: /fixture/cert.pem
      DEEPSEEK_API_KEY: test-deepseek-key-0000-synthetic
      DASHSCOPE_API_KEY: test-dashscope-key-0000-synthetic
      TYPESAFE_API_KEY: test-typesafe-key-0000-synthetic
      PROVIDER_RATES: '{"deepseek/deepseek-flash":[0.5,2],"qwen/qwen3.7-plus-2026-05-26":[1,4],"jev/jev-1.13.0":[0.042,0]}'
      ACTION_CREDENTIAL_KEY: 7e57000000000000000000000000000000000000000000000000000000007e57
      # Only these exact fixture names may resolve to the private Docker network; internal.fixture.test (same server) may not.
      TEST_PUBLIC_HOSTS: orders.fixture.test,other.fixture.test,site.fixture.test,api.deepseek.com,dashscope-intl.aliyuncs.com,api.typesafe.ai
      # The bundled demo service, exactly as a local demo enables it.
      DEMO_PUBLIC_HOSTS: northwind.demo.test
      DEMO_CA_FILE: /demo/cert.pem
    volumes: [./tests/fixture/cert.pem:/fixture/cert.pem:ro]
    # Approved-looking names that resolve to loopback, cloud-metadata link-local and private addresses.
    extra_hosts: ['loopback.fixture.test:127.0.0.1', 'metadata.fixture.test:169.254.169.254', 'private.fixture.test:10.255.255.1']
  # Tests drive the real demo service.
  demo:
    profiles: !reset []
  fixture:
    image: python:3.14.6-slim-bookworm@sha256:4c92ffcde4dd6f1ff72a24518f49fd4990b27134987dfa31a733badde66df9f8
    command: [python, -u, /fixture/server.py]
    volumes: [./tests/fixture:/fixture:ro]
    ports: ['127.0.0.1:${FIXTURE_PORT:-3199}:8080']
    networks:
      internal: {aliases: [api.deepseek.com, dashscope-intl.aliyuncs.com, api.typesafe.ai, orders.fixture.test, other.fixture.test, site.fixture.test, internal.fixture.test]}
      web: {}
